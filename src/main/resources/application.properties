# ===================================================================
# PerkMitra Backend Configuration
# ===================================================================
spring.application.name=perkmitra-backend
server.port=8080

# -------------------------------------------------------------------
# Load .env file automatically
# -------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# -------------------------------------------------------------------
# Supabase PostgreSQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# HikariCP Connection Pool (Optimized for Supabase)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=PerkMitraHikariCP

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Temporary Flyway diagnostic logging
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG
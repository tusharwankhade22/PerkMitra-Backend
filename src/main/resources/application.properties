# ===================================================================
# PerkMitra Backend Configuration
# ===================================================================
spring.application.name=perkmitra-backend
server.port=8080

# -------------------------------------------------------------------
# Supabase PostgreSQL Database Configuration
# -------------------------------------------------------------------
# You can override these via environment variables or .env file:
# DB_URL, DB_USERNAME, DB_PASSWORD
#
# Supabase Direct Connection format:
#   jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require
#
# Supabase Pooler Connection format (recommended for serverless/pooled connections):
#   jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perkmitra}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# HikariCP Connection Pool (Optimized for Supabase)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=PerkMitraHikariCP
